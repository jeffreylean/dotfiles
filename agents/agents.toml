version = 1

[shared]
skills = "skills"            # whole-dir link to ~/.agents/skills; every agent sees every skill in it
instructions = "AGENTS.md"   # ~/.agents/AGENTS.md, the target of every include

# Skills outside the shared tier. A pattern segment is a literal, `*`, or {a,b}.
# Every match must be a directory holding SKILL.md. Routes add up; none subtract.
[[skills]]
from = "claude/skills/*"
to = ["claude"]

[[skills]]
from = "pi/pi-skills/*"
to = ["pi"]

[[skills]]
from = "pi/extensions/*/skills/*"
to = ["pi"]

[[skills]]
from = "opencode/skills/*"
to = ["opencode"]

[[skills]]
from = "library/matt-skills/*"
to = ["codex", "opencode"]

[[skills]]
from = "library/matt-skills/{grill-with-docs,grilling,domain-modeling,handoff}"
to = ["claude", "pi"]

[claude]
instructions = "claude/CLAUDE.md"   # must contain the line @~/.agents/AGENTS.md

[claude.links]
"commands" = "commands"
"rules" = "claude/rules"
"agents" = "claude/agents"
"pstack-models.md" = "claude/pstack-models.md"

[claude.plugins]
marketplaces = { claude-plugins-official = "anthropics/claude-plugins-official", cloudflare = "cloudflare/skills", plannotator = "backnotprop/plannotator", pstack-claude = "michael-denyer/pstack-claude" }
install = [
  "cloudflare@cloudflare",
  "plannotator@plannotator",
  "pstack@pstack-claude",
  "lua-lsp@claude-plugins-official",
  "pyright-lsp@claude-plugins-official",
  "rust-analyzer-lsp@claude-plugins-official",
  "typescript-lsp@claude-plugins-official",
]

[pi]
instructions = "pi/APPEND_SYSTEM.md"  # Pi's own additions to its system prompt
# Pi packages are listed once, in pi/settings.json `packages`.

[pi.links]
"AGENTS.md" = "AGENTS.md"           # the shared prompt, which Pi loads in every project
"settings.json" = "pi/settings.json"
"context.md" = "pi/context.md"
"keybindings.json" = "pi/keybindings.json"
"agents" = "pi/agents"
"pstack-models.md" = "pi/pstack-models.md"
"extensions/*" = "pi/extensions/*"  # one link per child, so local files beside them stay

[codex]
instructions = "codex/AGENTS.md"    # generated into ~/.codex/AGENTS.md with @~/ lines expanded

[opencode]
instructions = "opencode/AGENTS.md" # the shared prompt comes from opencode.json "instructions"

[opencode.links]
"opencode.json" = "opencode/opencode.json"
"command" = "commands"
"agents" = "opencode/subagents"
